spring:
  application:
    # [프로젝트명] 스프링 부트 애플리케이션의 공식 이름입니다.
    name: pinword

  datasource:
    # 1. [DB 드라이버] Java 프로그램이 MySQL과 통신하기 위해 사용하는 전용 다리(클래스)입니다.
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 2. [DB 연결 주소] 내 컴퓨터(localhost)의 3306 포트에 있는 'pinword' 데이터베이스에 접속합니다.
    # - serverTimezone=Asia/Seoul : 데이터베이스에 저장되는 시간(예: 가입일 등)을 한국 시간으로 맞춥니다.
    # - characterEncoding=UTF-8 : 한글이나 이모지가 깨지지 않고 안전하게 저장되도록 합니다.
    url: jdbc:mysql://localhost:3306/pinword?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

    # 3. [DB 계정] 팀원들의 로컬 MySQL 아이디 (특별히 설정하지 않았다면 보통 root 입니다)
    username: root

    # 🚨 [DB 비밀번호 - 팀원별 수정 필요!]
    # 현재 적힌 비밀번호는 최초 작성자의 로컬 비밀번호입니다.
    # 다른 팀원들은 각자 본인 PC에 MySQL을 설치할 때 설정했던 비밀번호로 꼭 변경한 뒤 실행해 주세요!
    password: "0211"

  jpa:
    # 4. [DB 방언 설정] 스프링(JPA)에게 "우리는 MySQL을 쓸 거니까 MySQL 문법(방언)으로 쿼리를 작성해!"라고 강제 지정합니다.
    # 이 설정이 있어야 DB 연결 메타데이터를 못 읽어와서 서버가 뻗는 에러를 방지할 수 있습니다.
    database-platform: org.hibernate.dialect.MySQLDialect

    hibernate:
      # 🚨 5. [테이블 자동 생성 옵션 - 매우 중요]
      # update: 자바의 @Entity 코드를 읽어서, DB에 테이블이 없으면 새로 만들고, 컬럼이 추가되면 알아서 수정해 줍니다.
      # (주의: 실무 서버에 배포할 때는 기존 데이터가 날아갈 수 있으므로 절대 쓰면 안 되며, 'validate'나 'none'으로 바꿔야 합니다!)
      ddl-auto: update

    # 6. [쿼리 로깅] 스프링이 DB에 명령을 내릴 때, 실제로 어떤 SQL 쿼리문이 실행되는지 콘솔 창에 보여줍니다. (디버깅용)
    show-sql: true

    properties:
      hibernate:
        # 7. [쿼리 포맷팅] 한 줄로 길게 출력되는 SQL 쿼리를 개발자가 읽기 편하게 예쁘게 줄바꿈(정렬)해서 보여줍니다.
        format_sql: true

# ✨ 추가된 설정: JWT 보안 키
jwt:
  # 토큰 암호화에 사용되는 비밀번호입니다. 
  # 최소 32자 이상의 임의의 문자열을 권장합니다.
  secret: my-super-secret-key-for-pinword-project-needs-to-be-long-enough-for-security

