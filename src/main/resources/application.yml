spring:
  application:
    name: pinword

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 배포 시 환경변수 DB_URL / 로컬에서는 localhost 기본값 사용
    url: ${DB_URL:jdbc:mysql://localhost:3306/pinword?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0211}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 업로드 파일 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-pinword-project-needs-to-be-long-enough-for-security}

gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
